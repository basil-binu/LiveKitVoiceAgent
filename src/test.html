<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Voice Agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/livekit-client/2.5.4/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 24px;
    }

    h1 { font-size: 1.5rem; color: #94a3b8; }
    #status { font-size: 0.9rem; color: #64748b; }

    #prompt-input {
      width: 100%;
      max-width: 560px;
      min-height: 120px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    #prompt-input:focus { border-color: #6366f1; }

    .btn-secondary {
      background: #312e81;
      color: #e2e8f0;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-secondary:hover { opacity: 0.9; }

    #mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1e293b;
      color: #94a3b8;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #mic-btn.connected   { background: #312e81; color: #a5b4fc; }
    #mic-btn.speaking    { background: #1e3a5f; color: #60a5fa; }
    #mic-btn.agent-speaking { background: #1a3a2a; color: #4ade80; }

    #disconnect-btn {
      display: none;
      background: transparent;
      border: 1px solid #334155;
      color: #64748b;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    #log {
      width: 100%;
      max-width: 560px;
      height: 340px;
      overflow-y: auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 90%;
    }
    .msg.user   { background: #312e81; color: #c7d2fe; align-self: flex-end; }
    .msg.agent  { background: #1a3a2a; color: #bbf7d0; align-self: flex-start; }
    .msg.system { background: transparent; color: #64748b; align-self: center; font-style: italic; }

    /* ── KB upload panel ── */
    #kb-panel {
      width: 100%;
      max-width: 560px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #kb-panel h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin: 0;
    }

    #drop-zone {
      border: 1.5px dashed #334155;
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      color: #64748b;
      font-size: 0.9rem;
    }
    #drop-zone.dragover {
      border-color: #6366f1;
      background: #1a1f35;
      color: #a5b4fc;
    }
    #drop-zone input { display: none; }

    #drop-zone .drop-icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 6px;
    }

    #doc-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f1117;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .doc-item .doc-name {
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }

    .doc-item .doc-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .doc-badge.static   { background: #1e3a5f; color: #60a5fa; }
    .doc-badge.uploaded { background: #1a3a2a; color: #4ade80; }

    .doc-item .del-btn {
      background: transparent;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .doc-item .del-btn:hover { color: #f87171; }

    #kb-status {
      font-size: 0.8rem;
      color: #64748b;
      min-height: 1rem;
      text-align: center;
    }
    #kb-status.ok  { color: #4ade80; }
    #kb-status.err { color: #f87171; }

    #upload-progress {
      display: none;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
    }
    #upload-progress .bar {
      height: 100%;
      width: 0%;
      background: #6366f1;
      transition: width 0.3s;
    }
  </style>
</head>

<body>

  <h1>🎙️ Realtime Voice Agent</h1>
  <div id="status">Click the mic to connect</div>

  <textarea id="prompt-input" placeholder="Enter system prompt...">You are a helpful voice assistant.</textarea>
  <button id="update-prompt-btn" class="btn-secondary">Update Prompt</button>

  <button id="mic-btn">🎙️</button>
  <button id="disconnect-btn">Disconnect</button>

  <div id="log">
    <div class="msg system">Conversation will appear here...</div>
  </div>

  <!-- ── Knowledge Base Panel ── -->
  <div id="kb-panel">
    <h2>📚 Knowledge Base</h2>

    <div id="drop-zone">
      <span class="drop-icon">📄</span>
      Drop a PDF, TXT, or DOCX here<br>
      <small style="color:#475569">or click to browse</small>
      <input type="file" id="file-input" accept=".pdf,.txt,.docx" multiple />
    </div>

    <div id="upload-progress"><div class="bar" id="progress-bar"></div></div>

    <div id="kb-status"></div>

    <div id="doc-list">
      <div class="msg system" style="font-size:0.8rem; padding:0; margin:0;">Loading documents…</div>
    </div>
  </div>

  <script>
    // =====================================================
    // CONFIG
    // =====================================================
    const BASE = "http://localhost:8000";
    const TOKEN_ENDPOINT         = `${BASE}/token`;
    const UPDATE_PROMPT_ENDPOINT = `${BASE}/update-prompt`;
    const UPLOAD_ENDPOINT        = `${BASE}/upload`;
    const DELETE_ENDPOINT        = `${BASE}/delete-doc`;
    const LIST_ENDPOINT          = `${BASE}/list-docs`;
    const ROOM_NAME = "voice-room-" + crypto.randomUUID();

    // =====================================================
    // LIVEKIT
    // =====================================================
    const { Room, RoomEvent, Track } = LivekitClient;
    let room = null;

    // =====================================================
    // ELEMENTS
    // =====================================================
    const micBtn          = document.getElementById("mic-btn");
    const disconnectBtn   = document.getElementById("disconnect-btn");
    const statusEl        = document.getElementById("status");
    const logEl           = document.getElementById("log");
    const promptInput     = document.getElementById("prompt-input");
    const updatePromptBtn = document.getElementById("update-prompt-btn");
    const dropZone        = document.getElementById("drop-zone");
    const fileInput       = document.getElementById("file-input");
    const docList         = document.getElementById("doc-list");
    const kbStatus        = document.getElementById("kb-status");
    const uploadProgress  = document.getElementById("upload-progress");
    const progressBar     = document.getElementById("progress-bar");

    // =====================================================
    // HELPERS
    // =====================================================
    function setStatus(text) { statusEl.textContent = text; }

    function setKbStatus(text, type = "") {
      kbStatus.textContent = text;
      kbStatus.className = type;
    }

    function addMsg(text, role) {
      if (role === "user-interim") {
        let interim = logEl.querySelector(".interim");
        if (!interim) {
          interim = document.createElement("div");
          interim.className = "msg user interim";
          logEl.appendChild(interim);
        }
        interim.textContent = text;
        logEl.scrollTop = logEl.scrollHeight;
        return;
      }
      if (role === "user") {
        const interim = logEl.querySelector(".interim");
        if (interim) interim.remove();
      }
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // =====================================================
    // KB: LIST DOCS
    // =====================================================
    async function loadDocs() {
      try {
        const res = await fetch(LIST_ENDPOINT);
        const data = await res.json();
        renderDocs(data);
      } catch (e) {
        docList.innerHTML = `<div class="msg system" style="font-size:0.8rem;padding:0;">Could not load documents</div>`;
      }
    }

    function renderDocs(data) {
      if (data.total === 0) {
        docList.innerHTML = `<div class="msg system" style="font-size:0.8rem;padding:0;">No documents in knowledge base yet</div>`;
        return;
      }

      docList.innerHTML = "";

      const all = [
        ...data.static.map(f => ({ ...f, origin: "static" })),
        ...data.uploaded.map(f => ({ ...f, origin: "uploaded" })),
      ];

      all.forEach(f => {
        const item = document.createElement("div");
        item.className = "doc-item";

        const badge = f.origin === "uploaded"
          ? `<span class="doc-badge uploaded">uploaded</span>`
          : `<span class="doc-badge static">static</span>`;

        const delBtn = f.origin === "uploaded"
          ? `<button class="del-btn" title="Remove" data-name="${f.filename}">✕</button>`
          : ``;

        item.innerHTML = `
          <span class="doc-name" title="${f.filename}">${f.filename}</span>
          <span style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
            <span style="font-size:0.75rem;color:#475569;">${f.size_kb} KB</span>
            ${badge}
            ${delBtn}
          </span>
        `;

        const btn = item.querySelector(".del-btn");
        if (btn) btn.addEventListener("click", () => deleteDoc(f.filename));

        docList.appendChild(item);
      });
    }

    // =====================================================
    // KB: UPLOAD
    // =====================================================
    async function uploadFiles(files) {
      if (!files.length) return;

      uploadProgress.style.display = "block";
      progressBar.style.width = "0%";

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setKbStatus(`Uploading ${file.name}…`);
        progressBar.style.width = `${Math.round(((i) / files.length) * 100)}%`;

        const form = new FormData();
        form.append("file", file);

        try {
          const res = await fetch(UPLOAD_ENDPOINT, { method: "POST", body: form });
          const data = await res.json();

          if (!res.ok) {
            setKbStatus(`Error: ${data.detail}`, "err");
            continue;
          }

        } catch (e) {
          setKbStatus(`Upload failed: ${e.message}`, "err");
          continue;
        }
      }

      progressBar.style.width = "100%";
      setKbStatus(`${files.length === 1 ? files[0].name : files.length + " files"} added — KB updated ✓`, "ok");

      setTimeout(() => {
        uploadProgress.style.display = "none";
        progressBar.style.width = "0%";
      }, 1200);

      await loadDocs();
    }

    // =====================================================
    // KB: DELETE
    // =====================================================
    async function deleteDoc(filename) {
      setKbStatus(`Removing ${filename}…`);
      try {
        const res = await fetch(`${DELETE_ENDPOINT}/${encodeURIComponent(filename)}`, {
          method: "DELETE",
        });
        const data = await res.json();
        if (!res.ok) { setKbStatus(`Error: ${data.detail}`, "err"); return; }
        setKbStatus(`${filename} removed — KB updated ✓`, "ok");
        await loadDocs();
      } catch (e) {
        setKbStatus(`Delete failed: ${e.message}`, "err");
      }
    }

    // =====================================================
    // DROP ZONE EVENTS
    // =====================================================
    dropZone.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) uploadFiles([...fileInput.files]);
      fileInput.value = "";
    });

    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const files = [...e.dataTransfer.files].filter(f =>
        [".pdf", ".txt", ".docx"].some(ext => f.name.toLowerCase().endsWith(ext))
      );
      if (files.length) uploadFiles(files);
      else setKbStatus("Only PDF, TXT, and DOCX files are supported.", "err");
    });

    // =====================================================
    // UPDATE PROMPT
    // =====================================================
    updatePromptBtn.addEventListener("click", async () => {
      await fetch(UPDATE_PROMPT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room: ROOM_NAME, system_prompt: promptInput.value }),
      });
      addMsg("System prompt updated.", "system");
    });

    // =====================================================
    // CONNECT
    // =====================================================
    micBtn.addEventListener("click", async () => { if (room) return; await connect(); });
    disconnectBtn.addEventListener("click", () => disconnect());

    async function connect() {
      setStatus("Fetching token…");
      micBtn.disabled = true;
      try {
        const prompt = encodeURIComponent(promptInput.value);
        const res = await fetch(`${TOKEN_ENDPOINT}?room=${ROOM_NAME}&system_prompt=${prompt}`);
        const data = await res.json();

        room = new Room();
        bindRoomEvents();
        setStatus("Connecting…");
        await room.connect(data.url, data.token);
        await room.localParticipant.setMicrophoneEnabled(true);

        micBtn.className = "connected";
        micBtn.textContent = "🎙️";
        micBtn.disabled = false;
        disconnectBtn.style.display = "inline-block";
        setStatus("Connected — start talking");
        addMsg("Connected to voice agent.", "system");
      } catch (err) {
        console.error(err);
        setStatus("Connection failed");
        micBtn.disabled = false;
        room = null;
      }
    }

    // =====================================================
    // DISCONNECT
    // =====================================================
    function disconnect() {
      if (room) { room.disconnect(); room = null; }
      micBtn.className = "";
      micBtn.textContent = "🎙️";
      disconnectBtn.style.display = "none";
      setStatus("Disconnected");
      addMsg("Session ended.", "system");
    }

    // =====================================================
    // ROOM EVENTS
    // =====================================================
    function bindRoomEvents() {
      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === Track.Kind.Audio) track.attach();
      });

      room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
        segments.forEach(seg => {
          const isAgent = participant?.identity !== room.localParticipant.identity;
          if (isAgent) {
            if (seg.final) addMsg(seg.text, "agent");
          } else {
            if (seg.final) addMsg(seg.text, "user");
            else addMsg(seg.text, "user-interim");
          }
        });
      });

      room.on(RoomEvent.ActiveSpeakersChanged, speakers => {
        const localSpeaking = speakers.some(s => s.identity === room.localParticipant.identity);
        const agentSpeaking = speakers.some(s => s.identity !== room.localParticipant.identity);

        if (agentSpeaking) {
          micBtn.className = "agent-speaking";
          micBtn.textContent = "🔊";
          setStatus("Agent speaking...");
        } else if (localSpeaking) {
          micBtn.className = "speaking";
          micBtn.textContent = "🎙️";
          setStatus("Listening...");
        } else {
          micBtn.className = "connected";
          micBtn.textContent = "🎙️";
          setStatus("Connected");
        }
      });

      room.on(RoomEvent.Disconnected, () => disconnect());
    }

    // =====================================================
    // INIT
    // =====================================================
    loadDocs();

  </script>
</body>
</html>
