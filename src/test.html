<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pete's Inn — Voice Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/livekit-client/2.5.4/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 24px;
    }

    h1 { font-size: 1.4rem; color: #94a3b8; letter-spacing: 0.05em; }

    #status {
      font-size: 0.85rem;
      color: #64748b;
      height: 20px;
    }

    #mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1e293b;
      color: #94a3b8;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 0 0 rgba(99,102,241,0);
    }

    #mic-btn.connected {
      background: #312e81;
      color: #a5b4fc;
      box-shadow: 0 0 0 8px rgba(99,102,241,0.15);
    }

    #mic-btn.speaking {
      background: #1e3a5f;
      color: #60a5fa;
      box-shadow: 0 0 0 12px rgba(96,165,250,0.2);
      animation: pulse 1.2s infinite;
    }

    #mic-btn.agent-speaking {
      background: #1a3a2a;
      color: #4ade80;
      box-shadow: 0 0 0 12px rgba(74,222,128,0.2);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(96,165,250,0.2); }
      50%       { box-shadow: 0 0 0 16px rgba(96,165,250,0.05); }
    }

    #log {
      width: 100%;
      max-width: 560px;
      height: 340px;
      overflow-y: auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 90%;
    }

    .msg.user {
      background: #312e81;
      color: #c7d2fe;
      align-self: flex-end;
    }

    .msg.agent {
      background: #1a3a2a;
      color: #bbf7d0;
      align-self: flex-start;
    }

    .msg.system {
      background: transparent;
      color: #475569;
      font-size: 0.78rem;
      align-self: center;
      font-style: italic;
    }

    #disconnect-btn {
      display: none;
      background: transparent;
      border: 1px solid #334155;
      color: #64748b;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #disconnect-btn:hover { border-color: #ef4444; color: #ef4444; }
  </style>
</head>
<body>

  <h1>🏨 Pete's Inn — Voice Test</h1>
  <div id="status">Click the mic to connect</div>

  <button id="mic-btn" title="Connect">🎙️</button>
  <button id="disconnect-btn">Disconnect</button>

  <div id="log">
    <div class="msg system">Conversation will appear here...</div>
  </div>

  <script>
    // ── Config — change TOKEN_ENDPOINT to your FastAPI URL ──────────────────
    const TOKEN_ENDPOINT = "http://localhost:8000/token";
    const ROOM_NAME      = "petes-inn-test";

    // ── State ────────────────────────────────────────────────────────────────
    const { Room, RoomEvent, Track, TrackEvent } = LivekitClient;
    let room = null;

    const micBtn        = document.getElementById("mic-btn");
    const disconnectBtn = document.getElementById("disconnect-btn");
    const statusEl      = document.getElementById("status");
    const logEl         = document.getElementById("log");

    // ── UI helpers ────────────────────────────────────────────────────────────
    function setStatus(text) { statusEl.textContent = text; }

    function addMsg(text, role) {
      // Update existing interim user message if present
      if (role === "user-interim") {
        let interim = logEl.querySelector(".interim");
        if (!interim) {
          interim = document.createElement("div");
          interim.className = "msg user interim";
          logEl.appendChild(interim);
        }
        interim.textContent = text;
        logEl.scrollTop = logEl.scrollHeight;
        return;
      }

      // Finalise interim into a permanent user message
      if (role === "user") {
        const interim = logEl.querySelector(".interim");
        if (interim) interim.remove();
      }

      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ── Connect ───────────────────────────────────────────────────────────────
    micBtn.addEventListener("click", async () => {
      if (room) return; // already connected
      await connect();
    });

    disconnectBtn.addEventListener("click", () => disconnect());

    async function connect() {
      setStatus("Fetching token…");
      micBtn.disabled = true;

      try {
        const res  = await fetch(`${TOKEN_ENDPOINT}?room=${ROOM_NAME}`);
        const data = await res.json();

        room = new Room();
        bindRoomEvents();

        setStatus("Connecting…");
        await room.connect(data.url, data.token);

        await room.localParticipant.setMicrophoneEnabled(true);

        micBtn.className   = "connected";
        micBtn.textContent = "🎙️";
        micBtn.disabled    = false;
        disconnectBtn.style.display = "inline-block";
        setStatus("Connected — start talking");
        addMsg("Connected to Pete's Inn agent.", "system");

      } catch (err) {
        console.error(err);
        setStatus("Connection failed — check console");
        micBtn.disabled = false;
        room = null;
      }
    }

    function disconnect() {
      if (room) { room.disconnect(); room = null; }
      micBtn.className   = "";
      micBtn.textContent = "🎙️";
      micBtn.disabled    = false;
      disconnectBtn.style.display = "none";
      setStatus("Disconnected");
      addMsg("Session ended.", "system");
    }

    // ── Room events ───────────────────────────────────────────────────────────
    function bindRoomEvents() {

      // Agent audio track → play it
      room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
        if (track.kind === Track.Kind.Audio) {
          track.attach(); // auto-creates an <audio> element and plays
        }
      });

      // Transcriptions from the agent framework
      room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
        segments.forEach(seg => {
          const isAgent = participant?.identity !== room.localParticipant.identity;

          if (isAgent) {
            // Agent transcript (final only)
            if (seg.final) addMsg(seg.text, "agent");
          } else {
            // User transcript
            if (seg.final) {
              addMsg(seg.text, "user");
            } else {
              addMsg(seg.text, "user-interim");
            }
          }
        });
      });

      // Speaking indicators
      room.on(RoomEvent.ActiveSpeakersChanged, speakers => {
        const localSpeaking = speakers.some(
          s => s.identity === room.localParticipant.identity
        );
        const agentSpeaking = speakers.some(
          s => s.identity !== room.localParticipant.identity
        );

        if (agentSpeaking) {
          micBtn.className   = "agent-speaking";
          micBtn.textContent = "🔊";
          setStatus("Agent speaking…");
        } else if (localSpeaking) {
          micBtn.className   = "speaking";
          micBtn.textContent = "🎙️";
          setStatus("Listening…");
        } else {
          micBtn.className   = "connected";
          micBtn.textContent = "🎙️";
          setStatus("Connected — start talking");
        }
      });

      room.on(RoomEvent.Disconnected, () => {
        disconnect();
      });
    }
  </script>
</body>
</html>
